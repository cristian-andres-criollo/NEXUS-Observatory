services:
  db:
    image: pgvector/pgvector:pg15
    container_name: nexus_postgres
    restart: unless-stopped
    # Credenciales desde el archivo .env de la raíz (ver .env.example). Nunca en este archivo.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
    # Solo accesible desde esta máquina; los contenedores usan la red interna.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker
    environment:
      # Se construye con las mismas credenciales del servicio db
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexus_db}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres_data:
