sonar.projectKey=nexus-observatory
sonar.projectName=Nexus Observatory

# Comma-separated paths to directories containing main source files.
sonar.sources=backend/app,frontend/src

# Comma-separated paths to directories containing test files.
sonar.tests=backend/tests,frontend/src/tests

# Inclusions/Exclusions
sonar.test.inclusions=backend/tests/**,frontend/src/tests/**,frontend/**/*.test.*,frontend/**/*.spec.*
sonar.exclusions=backend/venv/**,frontend/node_modules/**,frontend/dist/**,**/*.pyc,**/__pycache__/**

# Coverage paths (assuming pytest and vitest standard outputs)
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
